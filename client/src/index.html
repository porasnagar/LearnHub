<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LearnHub</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="LearnHub — online learning management system: courses, assignments, feedback and grades.">
  <meta name="theme-color" content="#edeef6">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <script>
    // Apply the saved (or system) theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('lh-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <app-root></app-root>
</body>
</html>
