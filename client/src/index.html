<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LearnHub</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="LearnHub — see what's due, hand in your work and get your grades and feedback in one place.">
  <meta name="theme-color" content="#f3f2f7">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme (light / dark / auto) and accent hue before first paint, so nothing flashes.
    try {
      var p = localStorage.getItem('lh-theme');
      var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      var h = localStorage.getItem('lh-hue');
      if (h !== null && isFinite(+h)) document.documentElement.style.setProperty('--hue', String(+h));
      if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111016');
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
